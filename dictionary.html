<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4d2162">
<title>فەرهەنگی ئێمە 📖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--gold:#f6c870;--cream:#fff1dc}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    background:linear-gradient(165deg,#170a2b 0%,#4d2162 55%,#8a3a86 100%) fixed;color:var(--cream);
    font-family:'Amiri','Vazirmatn','Noto Naskh Arabic',Tahoma,serif;line-height:1.9;overflow-x:hidden;
  }
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:max(58px,calc(env(safe-area-inset-top) + 48px)) 16px 60px;text-align:center}
  h1{font-size:clamp(1.8rem,8vw,2.5rem);margin:.1em 0;color:var(--gold);line-height:1.6}
  .sub{font-family:'Vazirmatn',sans-serif;font-weight:300;font-size:.92rem;color:#ead7f3;margin:0}
  .count{font-family:'Vazirmatn',sans-serif;font-size:.85rem;color:#ffe2a1;margin:10px 0 0}
  .search{
    width:100%;max-width:380px;margin:16px auto 6px;display:block;font-family:'Vazirmatn',sans-serif;font-size:1rem;color:var(--cream);
    padding:11px 18px;border-radius:999px;border:1px solid rgba(246,200,112,.5);background:rgba(0,0,0,.28);outline:none;text-align:right
  }
  .search::placeholder{color:rgba(255,241,220,.45)}
  .search:focus{border-color:var(--gold)}

  .grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:20px}
  .fc{perspective:1000px;cursor:pointer;min-height:190px;opacity:0;transform:translateY(14px);transition:opacity .8s ease,transform .8s ease}
  .fc.vis{opacity:1;transform:none}
  .fc.hide{display:none}
  .inner{position:relative;width:100%;height:100%;min-height:190px;transition:transform .7s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
  .fc.flip .inner{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;border-radius:22px;padding:20px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid rgba(246,200,112,.5);box-shadow:0 12px 30px rgba(0,0,0,.35)
  }
  .front{background:linear-gradient(160deg,#5b2a72,#a24ea8)}
  .front .w{font-size:clamp(1.8rem,8vw,2.4rem);font-weight:700;color:var(--gold);line-height:1.6;text-shadow:0 0 18px rgba(246,200,112,.45)}
  .front .h{font-family:'Vazirmatn',sans-serif;font-weight:300;font-size:.78rem;color:#ead7f3;margin-top:8px}
  .back{background:linear-gradient(160deg,#2a123d,#5b2a72);transform:rotateY(180deg)}
  .back .m{font-size:clamp(1.15rem,5vw,1.4rem);line-height:2}
  .back .e{font-family:'Vazirmatn',sans-serif;font-weight:300;font-size:.82rem;color:#ffe2a1;margin-top:8px}
  .none{font-family:'Vazirmatn',sans-serif;font-weight:300;color:#ead7f3;margin-top:24px;display:none}
  .foot{margin-top:34px;font-family:'Vazirmatn',sans-serif;font-weight:300;font-size:.9rem;color:#ead7f3}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div style="font-size:2.6rem">📖</div>
  <h1>فەرهەنگی ئێمە</h1>
  <p class="sub">ئەو وشانەی تەنیا من و تۆ لێیان تێدەگەین 😄</p>
  <div class="count" id="count"></div>
  <input class="search" id="search" type="search" placeholder="🔍 بگەڕێ بە دوای وشەیەکدا...">
  <div class="grid" id="grid"></div>
  <p class="none" id="none">هیچ وشەیەک نەدۆزرایەوە 🤔</p>
  <p class="foot">وشەی نوێ هەر ڕۆژێک دێت 💗</p>
</div>

<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const toKu = v => String(v).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

  /* =========================================================
     ✍️  وشەی نوێ لێرە زیاد بکە
     هەر وشەیەک:  { w: 'وشەکە', m: 'واتاکەی', e: 'نموونە (ئارەزوومەندانە)' }
     ========================================================= */
  const DICT = [
    {w: 'بەیانیت باش', m: 'یەکەم پەیامی هەموو ڕۆژێک. هەمیشە سومەیە دەست پێدەکات، و ڕۆژەکەم بەو وشەیە جوان دەبێت.', e: '☀️ «بەیانیت باش» = من بیرم لێت کردەوە'},
    {w: 'تێر بوویت؟', m: 'پرسیاری نیوەڕۆ. واتا ڕاستەقینەکەی: «گرنگیت پێدەدەم و دڵم لای تۆیە».', e: 'کاتێک دەپرسێت: «چیت خوارد؟»'},
    {w: 'وەرە بخۆ', m: 'کاتێک سومەیە خواردن ئامادە دەکات و بانگم دەکات. منیش بەداخەوە ناتوانم بێم، بەڵام دڵم لەوێیە 🥹', e: 'هەموو ڕۆژێک'},
    {w: 'هەی هەتیم', m: 'کاتێک دەگەمەوە ماڵ و دیسان دەچمە حەمام، سومەیە بە شیرینی گلەیی دەکات 😂', e: '«دیسان چویتە حەمام هەی هەتیم»'},
    {w: 'ڤیتامین', m: 'کاتی چوونە بەر خۆری سومەیە، و هەمان کاتیش کاتی پەیوەندی تەلەفۆنی ئێمەیە ☀️📞', e: 'ڕۆژانە'},
    {w: 'پێکەنینی سومەیە', m: 'ئەو دەنگەی لە تەلەفۆندا دەبیسترێت و ڕۆژم پێ ڕوون دەبێتەوە. لەوانە زۆر بەدڵمە 😄', e: 'کاتی قسەکردن'}
  ];
  /* ========================================================= */

  $('count').textContent = toKu(DICT.length) + ' وشە لە فەرهەنگەکەماندا';
  const grid = $('grid');
  const cards = DICT.map(d => {
    const fc = document.createElement('div'); fc.className = 'fc';
    const inner = document.createElement('div'); inner.className = 'inner';
    const f = document.createElement('div'); f.className = 'face front';
    const w = document.createElement('div'); w.className = 'w'; w.textContent = d.w;
    const h = document.createElement('div'); h.className = 'h'; h.textContent = 'پەنجە بنێ بۆ ئەوەی واتاکەی ببینیت';
    f.appendChild(w); f.appendChild(h);
    const b = document.createElement('div'); b.className = 'face back';
    const m = document.createElement('div'); m.className = 'm'; m.textContent = d.m; b.appendChild(m);
    if (d.e){ const e = document.createElement('div'); e.className = 'e'; e.textContent = d.e; b.appendChild(e); }
    inner.appendChild(f); inner.appendChild(b); fc.appendChild(inner);
    fc.addEventListener('click', () => fc.classList.toggle('flip'));
    grid.appendChild(fc);
    return {el: fc, text: (d.w + ' ' + d.m + ' ' + (d.e || '')).toLowerCase()};
  });

  if ('IntersectionObserver' in window){
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('vis'); io.unobserve(e.target); } }), {threshold: .12});
    cards.forEach(c => io.observe(c.el));
  } else cards.forEach(c => c.el.classList.add('vis'));

  $('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    let shown = 0;
    cards.forEach(c => {
      const ok = !q || c.text.indexOf(q) !== -1;
      c.el.classList.toggle('hide', !ok); if (ok){ shown++; c.el.classList.add('vis'); }
    });
    $('none').style.display = shown ? 'none' : 'block';
  });

  /* floating dust */
  (function(){
    const cv = $('fx'), g = cv.getContext('2d'); let W, H, ps = [];
    function resize(){
      const dpr = Math.min(devicePixelRatio || 1, 1.75); W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
      ps = Array.from({length: 55}, () => ({x: Math.random() * W, y: Math.random() * H, r: .6 + Math.random() * 1.8, vy: .15 + Math.random() * .5, ph: Math.random() * 6.28}));
    }
    function frame(){
      g.clearRect(0, 0, W, H);
      for (const q of ps){
        q.ph += .02; q.y -= q.vy; q.x += Math.sin(q.ph) * .25;
        if (q.y < -10){ q.y = H + 10; q.x = Math.random() * W; }
        g.fillStyle = 'rgba(255,225,160,' + (.2 + .55 * Math.abs(Math.sin(q.ph))) + ')';
        g.beginPath(); g.arc(q.x, q.y, q.r, 0, 6.283); g.fill();
      }
      requestAnimationFrame(frame);
    }
    addEventListener('resize', resize); resize(); requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
