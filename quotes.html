<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4a3c">
<title>وتەی ئەمڕۆی سومەیە 💬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--gold:#f6c870;--cream:#fff1dc}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    background:linear-gradient(165deg,#031c18 0%,#0b4a3c 50%,#3a1230 100%) fixed;color:var(--cream);
    font-family:'Amiri','Vazirmatn','Noto Naskh Arabic',Tahoma,serif;line-height:1.9;overflow-x:hidden;
  }
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:max(58px,calc(env(safe-area-inset-top) + 48px)) 16px 70px}
  .head{text-align:center}
  h1{font-size:clamp(1.8rem,8vw,2.5rem);margin:.1em 0;color:var(--gold);line-height:1.6}
  .sub{font-family:'Vazirmatn',sans-serif;font-weight:300;font-size:.92rem;color:#d6f3e6;margin:0}
  .dice{
    font-family:'Vazirmatn',sans-serif;font-size:1rem;font-weight:600;color:#3a1220;margin:18px 0 6px;
    background:linear-gradient(135deg,#ffe2a1,#f1b255);border:none;border-radius:999px;padding:11px 26px;cursor:pointer;box-shadow:0 8px 22px rgba(241,178,85,.35)
  }
  .dice:active{transform:scale(.95)}

  .day{font-family:'Vazirmatn',sans-serif;font-size:.8rem;color:#9ff0b7;text-align:center;margin:26px 0 10px;letter-spacing:.02em}
  .msg{margin:0 0 18px;opacity:0;transform:translateY(14px);transition:opacity .8s ease,transform .8s ease}
  .msg.vis{opacity:1;transform:none}
  .who{display:flex;align-items:flex-start;gap:10px}
  .av{flex:none;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ffe2a1,#d9893a);color:#4a1a2a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem}
  .av.me{background:linear-gradient(135deg,#9fe8c9,#3a9a78);color:#07261e;width:28px;height:28px;font-size:.85rem}
  .bub{
    max-width:calc(100% - 50px);padding:11px 18px;border-radius:20px 6px 20px 20px;font-size:1.28rem;line-height:2;
    background:rgba(255,255,255,.12);border:1px solid rgba(246,200,112,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  .note{display:flex;align-items:flex-start;gap:8px;margin:8px 48px 0 0;font-family:'Vazirmatn',sans-serif;font-weight:300;font-size:.85rem;color:#d6f3e6;line-height:1.8}
  .msg.flash .bub{animation:flash 1.6s ease}
  @keyframes flash{0%,100%{box-shadow:0 0 0 rgba(246,200,112,0)}30%{box-shadow:0 0 34px rgba(246,200,112,.95);transform:scale(1.03)}}
  .foot{margin-top:34px;text-align:center;font-family:'Vazirmatn',sans-serif;font-weight:300;font-size:.9rem;color:#d6f3e6}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="head">
    <div style="font-size:2.6rem">💬</div>
    <h1>وتەی ئەمڕۆی سومەیە</h1>
    <p class="sub">ئەو ڕستە شیرینانەی هەموو ڕۆژێک دەیڵێت، و من هەمووی لێرە کۆدەکەمەوە</p>
    <button class="dice" id="dice">🎲 وتەیەکی هەڵکەوت</button>
  </div>
  <div id="feed"></div>
  <p class="foot">وتەی نوێ هەر ڕۆژێک دێت 💗</p>
</div>

<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const toKu = v => String(v).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const MONTHS = ['کانوونی دووەم','شوبات','ئازار','نیسان','ئایار','حوزەیران','تەمووز','ئاب','ئەیلوول','تشرینی یەکەم','تشرینی دووەم','کانوونی یەکەم'];
  const fmt = iso => { const p = iso.split('-').map(Number); return toKu(p[2]) + 'ی ' + MONTHS[p[1] - 1]; };

  /* =========================================================
     ✍️  وتەی نوێ لێرە زیاد بکە
     هەر وتەیەک:  { d: 'ساڵ-مانگ-ڕۆژ', t: 'وتەکەی سومەیە', n: 'تێبینی تۆ (ئارەزوومەندانە)' }
     ئەگەر d بەتاڵ بێت '' ، لە بەشی «هەمیشەیی» دادەنرێت.
     نوێترین وتە لە کۆتایی لیستەکە دابنێ.
     (ئەم وتانەی خوارەوە نزیکن لە وتە ڕاستەکانی، ئارەزووی خۆتە بیانگۆڕیت بە وشە ڕاستەکانی ئەو)
     ========================================================= */
  const QUOTES = [
    {d: '', t: 'بەیانیت باش 🌞', n: 'یەکەم نامەی هەموو ڕۆژێک... و هەمیشە تۆ دەست پێدەکەیت 🥹'},
    {d: '', t: 'چیت خوارد؟ تێر بوویت؟', n: 'نیوەڕۆ، بێ جیاوازی. ئەمە واتای «گرنگیت پێدەدەم»ە 💗'},
    {d: '', t: 'وەرە بخۆ، خواردنم ئامادە کردووە', n: 'منیش بەداخەوە ناتوانم... بەڵام دڵم لەوێیە 🥹'},
    {d: '', t: 'ئێستا لە بەر خۆرم، و بە تەلەفۆن لەگەڵتم ☀️📞', n: 'ڤیتامین و دەنگی تۆ، دوو سوودی لە یەک کاتدا 😄'},
    {d: '', t: 'دیسان چویتە حەمام هەی هەتیم 😂', n: 'کاتێک دەگەمەوە ماڵ و خۆم دەشۆم... ئەو بەدڵی نییە 😅'}
  ];
  /* ========================================================= */

  const feed = $('feed');
  const groups = [];
  const always = QUOTES.filter(q => !q.d);
  const dated = QUOTES.filter(q => q.d);
  // dated: newest day first
  const days = Array.from(new Set(dated.map(q => q.d))).sort().reverse();
  days.forEach(day => groups.push({title: fmt(day), items: dated.filter(q => q.d === day).reverse()}));
  if (always.length) groups.push({title: 'ڕستە هەمیشەییەکان ✨', items: always});

  const nodes = [];
  groups.forEach(g => {
    const h = document.createElement('div'); h.className = 'day'; h.textContent = g.title; feed.appendChild(h);
    g.items.forEach(q => {
      const m = document.createElement('div'); m.className = 'msg';
      const w = document.createElement('div'); w.className = 'who';
      const av = document.createElement('div'); av.className = 'av'; av.textContent = 'س';
      const b = document.createElement('div'); b.className = 'bub'; b.textContent = q.t;
      w.appendChild(av); w.appendChild(b); m.appendChild(w);
      if (q.n){
        const nt = document.createElement('div'); nt.className = 'note';
        const a2 = document.createElement('div'); a2.className = 'av me'; a2.textContent = 'د';
        const tx = document.createElement('div'); tx.textContent = q.n;
        nt.appendChild(a2); nt.appendChild(tx); m.appendChild(nt);
      }
      feed.appendChild(m); nodes.push(m);
    });
  });

  if ('IntersectionObserver' in window){
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('vis'); io.unobserve(e.target); } }), {threshold: .15});
    nodes.forEach(e => io.observe(e));
  } else nodes.forEach(e => e.classList.add('vis'));

  let last = -1;
  $('dice').addEventListener('click', () => {
    if (!nodes.length) return;
    let i; do { i = Math.floor(Math.random() * nodes.length); } while (nodes.length > 1 && i === last);
    last = i;
    const m = nodes[i]; m.classList.add('vis');
    m.scrollIntoView({behavior: 'smooth', block: 'center'});
    m.classList.remove('flash'); void m.offsetWidth; m.classList.add('flash');
    if (navigator.vibrate) navigator.vibrate(30);
  });

  /* soft green glow orbs */
  (function(){
    const cv = $('fx'), g = cv.getContext('2d'); let W, H, ps = [];
    function resize(){
      const dpr = Math.min(devicePixelRatio || 1, 1.75); W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
      ps = Array.from({length: 18}, () => ({x: Math.random() * W, y: Math.random() * H, r: 12 + Math.random() * 28, vy: .1 + Math.random() * .35, ph: Math.random() * 6.28, a: .14 + Math.random() * .2}));
    }
    function frame(){
      g.clearRect(0, 0, W, H);
      for (const q of ps){
        q.ph += .015; q.y -= q.vy; q.x += Math.sin(q.ph) * .2;
        if (q.y < -50){ q.y = H + 50; q.x = Math.random() * W; }
        const a = q.a * (.6 + .4 * Math.sin(q.ph * 2));
        const gr = g.createRadialGradient(q.x, q.y, 0, q.x, q.y, q.r);
        gr.addColorStop(0, 'rgba(120,255,190,' + a + ')'); gr.addColorStop(1, 'rgba(120,255,190,0)');
        g.fillStyle = gr; g.fillRect(q.x - q.r, q.y - q.r, q.r * 2, q.r * 2);
      }
      requestAnimationFrame(frame);
    }
    addEventListener('resize', resize); resize(); requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
