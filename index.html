<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0a1e">
<title>ئەلبومی ئێمە 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--gold:#f6c870;--cream:#fff1dc}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    background:linear-gradient(165deg,#2a0a1e 0%,#4d1030 55%,#7a1b45 100%) fixed;color:var(--cream);
    font-family:'Amiri','Vazirmatn','Noto Naskh Arabic',Tahoma,serif;line-height:1.9;overflow-x:hidden;
  }
  body.lock{overflow:hidden}
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

  /* ---------- splash (easy door) ---------- */
  #splash{
    position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
    background:linear-gradient(165deg,#2a0a1e 0%,#4d1030 55%,#7a1b45 100%);transition:opacity .9s ease,visibility .9s ease;
  }
  #splash.gone{opacity:0;visibility:hidden}
  .sp-hi{font-size:clamp(2rem,9vw,3rem);font-weight:700;color:var(--gold);line-height:1.6;opacity:0;animation:up 1.2s ease .2s forwards}
  .sp-sub{font-family:'Vazirmatn',sans-serif;font-weight:300;font-size:1rem;color:#f3d9c8;margin:6px 0 22px;opacity:0;animation:up 1.2s ease .8s forwards}
  .door{background:none;border:none;padding:0;cursor:pointer;opacity:0;animation:up 1.2s ease 1.3s forwards;filter:drop-shadow(0 10px 24px rgba(255,90,140,.55))}
  .door svg{width:150px;height:140px;display:block;animation:beat 1.6s ease-in-out infinite}
  .door:active svg{transform:scale(.92)}
  .sp-hint{font-family:'Vazirmatn',sans-serif;font-size:.9rem;color:#f3d9c8;margin-top:14px;opacity:0;animation:up 1s ease 2.2s forwards}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.13)}60%{transform:scale(1)}}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* ---------- hub ---------- */
  #hub{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:max(26px,env(safe-area-inset-top)) 16px 50px;opacity:0;transition:opacity 1s ease}
  #hub.show{opacity:1}
  .hi2{font-size:1.25rem;color:var(--gold);font-weight:700}
  h1{font-size:clamp(2rem,9vw,2.8rem);margin:.05em 0 0;line-height:1.6}
  .sub{font-family:'Vazirmatn',sans-serif;font-weight:300;font-size:.92rem;color:#f3d9c8;margin:0 0 6px}
  .newline{font-family:'Vazirmatn',sans-serif;font-size:.9rem;color:#3a1220;background:linear-gradient(135deg,#ffe2a1,#f1b255);display:inline-block;padding:4px 14px;border-radius:999px;margin:6px 0 16px;font-weight:600}
  .newline[hidden]{display:none}

  .card{
    position:relative;border-radius:22px;padding:18px 16px;cursor:pointer;overflow:hidden;
    border:1px solid rgba(246,200,112,.38);box-shadow:0 12px 30px rgba(0,0,0,.35);
    display:flex;flex-direction:column;justify-content:flex-end;min-height:170px;
    opacity:0;animation:up .8s ease forwards;transition:transform .15s ease;
  }
  .card:active{transform:scale(.97)}
  .card .em{font-size:2.5rem;line-height:1.2;margin-bottom:auto}
  .card h3{font-size:1.28rem;margin:6px 0 0;line-height:1.6;text-shadow:0 2px 12px rgba(0,0,0,.4)}
  .card p{font-family:'Vazirmatn',sans-serif;font-weight:300;font-size:.82rem;margin:2px 0 0;color:#ffeee0;opacity:.9;line-height:1.7}
  .card small{font-family:'Vazirmatn',sans-serif;font-size:.72rem;color:#ffe2a1;margin-top:8px;opacity:.85}
  .badge{
    position:absolute;top:12px;left:12px;font-family:'Vazirmatn',sans-serif;font-size:.72rem;font-weight:700;color:#3a1220;
    background:linear-gradient(135deg,#ffe2a1,#f1b255);padding:2px 10px;border-radius:999px;animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .hero{min-height:210px;margin-bottom:14px}
  .hero .em{font-size:3.2rem}
  .hero h3{font-size:1.6rem}
  .tag{position:absolute;top:14px;right:16px;font-family:'Vazirmatn',sans-serif;font-size:.78rem;color:#ffe2a1;letter-spacing:.02em}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .foot{text-align:center;font-family:'Vazirmatn',sans-serif;font-weight:300;font-size:.88rem;color:#f3d9c8;margin-top:28px}

  /* ---------- viewer ---------- */
  #viewer{position:fixed;inset:0;z-index:20;background:#1a0612;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s ease}
  #viewer.open{opacity:1;visibility:visible}
  #back{
    position:absolute;z-index:30;top:max(10px,env(safe-area-inset-top));right:10px;
    font-family:'Vazirmatn',sans-serif;font-size:.85rem;font-weight:600;color:#fff;background:rgba(0,0,0,.45);
    border:1px solid rgba(246,200,112,.55);border-radius:999px;padding:6px 14px;cursor:pointer;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  #frame{flex:1;width:100%;border:0;background:#1a0612}
</style>
</head>
<body>

<canvas id="fx"></canvas>

<!-- ======= SPLASH: tap the heart to come in ======= -->
<section id="splash">
  <div class="sp-hi" id="hi"></div>
  <p class="sp-sub">ئەمە ژوورەکەی ئێمەیە، تەنیا بۆ تۆ 💌</p>
  <button class="door" id="door" aria-label="بچۆرە ژوورەوە">
    <svg viewBox="0 0 32 29.6" aria-hidden="true">
      <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9ab8"/><stop offset="1" stop-color="#d4245f"/></linearGradient></defs>
      <path fill="url(#hg)" d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>
    </svg>
  </button>
  <div class="sp-hint">دڵەکە بپەستێوە بۆ ئەوەی بچیتە ژوورەوە</div>
</section>

<!-- ======= HUB ======= -->
<main id="hub">
  <div class="hi2" id="hi2"></div>
  <h1>ئەلبومی ئێمە 🎞️</h1>
  <p class="sub" id="sub"></p>
  <div class="newline" id="newline" hidden></div>
  <div id="hero"></div>
  <div class="grid" id="grid"></div>
  <p class="foot">هەر ڕۆژێک شتێکی نوێ دێت 💗</p>
</main>

<!-- ======= VIEWER (opens each item inside the album) ======= -->
<div id="viewer">
  <button id="back">‹ گەڕانەوە بۆ ئەلبوم</button>
  <iframe id="frame" title="بابەت" allow="autoplay; vibrate"></iframe>
</div>

<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const toKu = v => String(v).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

  /* =========================================================
     ✍️  لێرەوە شتی نوێ زیاد بکە
     هەر بابەتێک یەک دێڕە. بۆ بابەتی نوێ:
       ١. فایلی HTMLی نوێ لە هەمان فۆڵدەر دابنێ (نموونە: day5.html)
       ٢. دێڕێک لە خوارەوە لە کۆتایی لیستەکە زیاد بکە
     ڕەنگ: wine | night | emerald | rose | gold | plum
     بەروار بە شێوەی: 'ساڵ-مانگ-ڕۆژ'
     ========================================================= */
  const ITEMS = [
    {id: 'journey',    file: 'journey.html',    emoji: '✨', title: 'سەفەری ئاسمان',        desc: 'ئەستێرەکان و چیرۆکی ئێمە',               date: '2026-11-15', color: 'night'},
    {id: 'story',      file: 'story.html',      emoji: '💌', title: 'نامەی کارتەکان',      desc: 'کارت بە کارت، هێدی هێدی بیخوێنەوە',      date: '2026-11-18', color: 'wine'},
    {id: 'dictionary', file: 'dictionary.html', emoji: '📖', title: 'فەرهەنگی ئێمە',        desc: 'ئەو وشانەی تەنیا ئێمە لێیان تێدەگەین',   date: '2026-11-19', color: 'plum'},
    {id: 'quotes',     file: 'quotes.html',     emoji: '💬', title: 'وتەی ئەمڕۆی سومەیە',  desc: 'ئەو ڕستە شیرینانەی هەموو ڕۆژێک',         date: '2026-11-19', color: 'emerald'},
    {id: 'reasons',    file: 'reasons.html',    emoji: '💗', title: 'هۆکارێک بۆ خۆشویستنت', desc: 'هەر ڕۆژێک هۆکارێکی نوێ',                 date: '2026-11-19', color: 'rose'}
  ];
  /* ========================================================= */

  const BG = {
    wine:    'linear-gradient(160deg,#4d1030,#8a1f4c)',
    night:   'linear-gradient(160deg,#1a1245,#4a2a85)',
    emerald: 'linear-gradient(160deg,#0b4a3c,#2e7a5a)',
    rose:    'linear-gradient(160deg,#8a1f4c,#d24b78)',
    gold:    'linear-gradient(160deg,#6b3c12,#c28a2c)',
    plum:    'linear-gradient(160deg,#4d2162,#9a47a0)'
  };
  const MONTHS = ['کانوونی دووەم','شوبات','ئازار','نیسان','ئایار','حوزەیران','تەمووز','ئاب','ئەیلوول','تشرینی یەکەم','تشرینی دووەم','کانوونی یەکەم'];
  function fmt(iso){
    const p = iso.split('-').map(Number);
    return toKu(p[2]) + 'ی ' + MONTHS[p[1] - 1];
  }

  /* ---------- greeting by time of day ---------- */
  const h = new Date().getHours();
  let hi, sub;
  if (h >= 5 && h < 11){ hi = 'بەیانیت باش سومەیە ☀️'; sub = 'ڕۆژێکی جوانت هەبێت 💗'; }
  else if (h >= 11 && h < 15){ hi = 'نیوەڕۆت باش سومەیە 🌤️'; sub = 'تێر بوویت؟ 😄'; }
  else if (h >= 15 && h < 19){ hi = 'ئێوارەت باش سومەیە 🌇'; sub = 'ئاسوودە بیت 💗'; }
  else { hi = 'شەوت باش سومەیە 🌙'; sub = 'ئاسوودە بخەویت 💗'; }
  $('hi').textContent = hi;
  $('hi2').textContent = hi;
  $('sub').textContent = 'هەموو ئەو شتانەی بۆ تۆم دروست کردوون لێرەن، پەنجە لەسەر هەر یەکێک بنێ';

  /* ---------- seen / new badges ---------- */
  const KEY = 'sumaya_seen_v1';
  let seen = {};
  try { seen = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { seen = {}; }
  function markSeen(id){
    seen[id] = 1;
    try { localStorage.setItem(KEY, JSON.stringify(seen)); } catch (e) {}
  }

  /* ---------- render ---------- */
  const sorted = ITEMS.map((it, i) => Object.assign({i: i}, it)).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.i - a.i);

  function mkCard(it, big, delay){
    const c = document.createElement('div');
    c.className = 'card' + (big ? ' hero' : '');
    c.style.background = BG[it.color] || BG.wine;
    c.style.animationDelay = delay + 's';
    if (big){ const t = document.createElement('div'); t.className = 'tag'; t.textContent = 'نوێترین ✨'; c.appendChild(t); }
    if (!seen[it.id]){ const b = document.createElement('div'); b.className = 'badge'; b.textContent = 'نوێ ✨'; c.appendChild(b); }
    const em = document.createElement('div'); em.className = 'em'; em.textContent = it.emoji; c.appendChild(em);
    const t = document.createElement('h3'); t.textContent = it.title; c.appendChild(t);
    const p = document.createElement('p'); p.textContent = it.desc; c.appendChild(p);
    const s = document.createElement('small'); s.textContent = fmt(it.date); c.appendChild(s);
    c.addEventListener('click', () => openItem(it.id, true));
    return c;
  }
  function render(){
    $('hero').innerHTML = ''; $('grid').innerHTML = '';
    if (!sorted.length) return;
    $('hero').appendChild(mkCard(sorted[0], true, 0.1));
    sorted.slice(1).forEach((it, k) => $('grid').appendChild(mkCard(it, false, 0.25 + k * 0.1)));
    const n = sorted.filter(it => !seen[it.id]).length;
    const nl = $('newline');
    if (n > 0){ nl.hidden = false; nl.textContent = toKu(n) + ' شتی نوێت هەیە 💌'; } else nl.hidden = true;
  }
  render();

  /* ---------- door ---------- */
  $('door').addEventListener('click', () => {
    $('splash').classList.add('gone');
    $('hub').classList.add('show');
  });

  /* ---------- viewer ---------- */
  function openItem(id, push){
    const it = ITEMS.find(x => x.id === id); if (!it) return;
    $('frame').src = it.file;
    $('viewer').classList.add('open');
    document.body.classList.add('lock');
    markSeen(id);
    if (push) { try { history.pushState({id: id}, '', '#' + id); } catch (e) {} }
  }
  function closeViewer(fromPop){
    $('viewer').classList.remove('open');
    document.body.classList.remove('lock');
    setTimeout(() => { $('frame').src = 'about:blank'; }, 350);
    render();
    if (!fromPop && location.hash){
      try { history.back(); } catch (e) {}
      setTimeout(() => { if (location.hash){ try { history.replaceState(null, '', location.pathname); } catch (e) {} } }, 250);
    }
  }
  $('back').addEventListener('click', () => closeViewer(false));
  addEventListener('popstate', () => {
    if (!location.hash) closeViewer(true);
    else openItem(location.hash.slice(1), false);
  });
  if (location.hash){ try { history.replaceState(null, '', location.pathname); } catch (e) {} }

  /* ---------- floating dust ---------- */
  (function(){
    const cv = $('fx'), g = cv.getContext('2d'); let W, H, ps = [];
    function resize(){
      const dpr = Math.min(devicePixelRatio || 1, 1.75); W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
      ps = Array.from({length: 55}, () => ({x: Math.random() * W, y: Math.random() * H, r: .6 + Math.random() * 1.8, vy: .15 + Math.random() * .5, ph: Math.random() * 6.28}));
    }
    function frame(){
      g.clearRect(0, 0, W, H);
      for (const q of ps){
        q.ph += .02; q.y -= q.vy; q.x += Math.sin(q.ph) * .25;
        if (q.y < -10){ q.y = H + 10; q.x = Math.random() * W; }
        g.fillStyle = 'rgba(255,225,160,' + (.2 + .55 * Math.abs(Math.sin(q.ph))) + ')';
        g.beginPath(); g.arc(q.x, q.y, q.r, 0, 6.283); g.fill();
      }
      requestAnimationFrame(frame);
    }
    addEventListener('resize', resize); resize(); requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
